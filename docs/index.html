    <script>
      // Splash Screen Controller
      window.splashController = {
        splashElement: null,
        progressContainer: null,
        progressFill: null,
        progressMessage: null,
        progressPercentage: null,
        progressDetails: null,

        init() {
          this.splashElement = document.getElementById('splash-screen');
          this.progressContainer = document.getElementById('progress-container');
          this.progressFill = document.getElementById('progress-fill');
          this.progressMessage = document.getElementById('progress-message');
          this.progressPercentage = document.getElementById('progress-percentage');
          this.progressDetails = document.getElementById('progress-details');
        },

        updateProgress(current, total, message = '載入中...') {
          if (!this.progressContainer) return;

          if (total > 0) {
            this.progressContainer.classList.remove('hidden');
            const percentage = Math.round((current / total) * 100);

            this.progressFill.style.width = percentage + '%';
            this.progressMessage.textContent = message;
            this.progressPercentage.textContent = percentage + '%';
            this.progressDetails.textContent = `${current} / ${total}`;

            // Update aria attributes
            this.progressContainer.setAttribute('aria-valuenow', percentage);
            this.progressContainer.setAttribute('aria-label', `載入進度: ${percentage}%`);

            // 更新螢幕閱讀器狀態
            const statusElement = document.getElementById('progress-status');
            if (statusElement) {
              statusElement.textContent = `${message} ${percentage}% 完成，${current} 項目，共 ${total} 項目`;
            }

            // 播放載入完成的音效提示（可選）
            if (percentage === 100) {
              this.announceCompletion();
            }
          }
        },

        announceCompletion() {
          const statusElement = document.getElementById('progress-status');
          if (statusElement) {
            statusElement.textContent = '載入完成！即將進入應用程式主畫面。';
          }
        },

        hide() {
          if (this.splashElement) {
            // 通知螢幕閱讀器載入完成
            this.splashElement.setAttribute('aria-busy', 'false');
            this.splashElement.setAttribute('aria-hidden', 'true');

            // 移除 dialog 角色和 modal 屬性
            this.splashElement.removeAttribute('role');
            this.splashElement.removeAttribute('aria-modal');

            this.splashElement.classList.add('hidden');

            setTimeout(() => {
              if (this.splashElement && this.splashElement.parentNode) {
                this.splashElement.parentNode.removeChild(this.splashElement);

                // 將焦點移到主內容
                const mainContent = document.getElementById('main-content');
                if (mainContent) {
                  mainContent.focus();
                }
              }
