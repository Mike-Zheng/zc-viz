    <!-- Google tag (gtag.js) - 極度延遲載入以減少 TBT -->
    <script>
      // 延遲載入 Google Analytics 直到頁面完全載入後
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-E0Q7SESTV9')

      // 在 load 事件後的 idle callback 載入 gtag.js，但延遲更久
      function loadGtag() {
        const script = document.createElement('script')
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-E0Q7SESTV9'
        script.async = true
        document.head.appendChild(script)
      }

      // 等待使用者互動或 10 秒後再載入
      let gaLoaded = false
      function tryLoadGA() {
        if (!gaLoaded) {
          gaLoaded = true
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGtag, { timeout: 10000 })
          } else {
            setTimeout(loadGtag, 10000)
          }
        }
      }

      window.addEventListener('load', () => {
        setTimeout(tryLoadGA, 3000) // 頁面載入後 3 秒
      })

      // 使用者互動時也觸發載入 - scroll 綁定到 window，並檢測 passive 支援
      ;(function () {
        // 檢測是否支援 passive 選項
        let passiveSupported = false
        try {
          const options = Object.defineProperty({}, 'passive', {
            get() {
              passiveSupported = true
            },
          })
          window.addEventListener('testPassive', null, options)
          window.removeEventListener('testPassive', null, options)
        } catch (e) {
          passiveSupported = false
        }

        const opts = passiveSupported ? { once: true, passive: true } : { once: true }

        // document 事件
        ;['mousedown', 'touchstart', 'keydown'].forEach(event => {
          document.addEventListener(event, tryLoadGA, opts)
        })

        // window 事件 (scroll 必須綁在 window 上)
        window.addEventListener('scroll', tryLoadGA, opts)
      })()
    </script>
    <style>
      /* 無障礙改進 */

      /* Splash Screen Styles - 最佳化首次內容繪製 */
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease;
        /* 簡化渲染最佳化 */
        contain: strict;
      }

      /* 骨架屏快速渲染 - 提升感知效能 */
      .skeleton-app {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #f5f5f5;
        z-index: 9998;
        pointer-events: none;
        /* 極速渲染最佳化 */
        contain: strict;
        will-change: opacity;
      }

      /* 模擬主要UI佈局的骨架屏 - 簡化版本 */
      .skeleton-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: #e0e0e0;
        /* 移除動畫以更快渲染 */
      }

      .skeleton-sidebar {
        position: absolute;
        top: 60px;
        left: 0;
        width: 300px;
        bottom: 0;
        background: #e8e8e8;
      }

      .skeleton-viewer {
        position: absolute;
        top: 60px;
        left: 300px;
        right: 0;
        bottom: 0;
        background: #f0f0f0;
        /* 新增一個簡單的中心載入指示 */
      }

      .skeleton-viewer::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border: 4px solid #ddd;
        border-top-color: #0e62cc;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        max-width: 90vw;
      }

      .splash-logo {
        overflow: visible;
      }

      .splash-logo svg {
        overflow: visible;
        max-width: 100%;
        height: auto;
      }

      /* 簡化動畫以減少 CPU 負載 */
      .splash-logo #line {
        animation: draw 2s ease-in-out infinite;
      }

      @keyframes draw {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 900; }
      }

      .progress-container {
        width: 100%;
        max-width: 300px;
        min-width: 250px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: 50px;
      }

      .progress-bar {
        width: 100%;
        height: 4px;
        background-color: #e0e0e0;
        border-radius: 2px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #0e62cc, #0cccff);
        transition: width 0.3s ease;
        border-radius: 2px;
        width: 0%;
      }

      .progress-text {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        color: #424242;
        font-family: 'Chiron GoRound TC', sans-serif;
      }

      .progress-message {
      }

      .progress-percentage {
        color: #0e62cc;
      }

      .progress-details {
        text-align: center;
        font-size: 12px;
        color: #757575;
      }

      /* 隱藏進度條直到有資料 */
      .progress-container.hidden {
        display: none;
      }

      /* 螢幕閱讀器專用內容 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* 響應式設計 */
      @media (max-width: 480px) {
        .splash-content {
          gap: 1.5rem;

        }

        .progress-details {

        }
      }

      @media (max-height: 600px) {
        .splash-content {
          gap: 1rem;
        }

        .splash-logo svg {
          width: 80px;
          height: auto;
        }
      }
    </style>

    <script>
      // Splash Screen Controller
      window.splashController = {
        splashElement: null,
        progressContainer: null,
        progressFill: null,
        progressMessage: null,
        progressPercentage: null,
        progressDetails: null,

        init() {
          this.splashElement = document.getElementById('splash-screen')
          this.progressContainer = document.getElementById('progress-container')
          this.progressFill = document.getElementById('progress-fill')
          this.progressMessage = document.getElementById('progress-message')
          this.progressPercentage = document.getElementById('progress-percentage')
          this.progressDetails = document.getElementById('progress-details')
        },

        updateProgress(current, total, message = '載入中...') {
          if (!this.progressContainer) return

          if (total > 0) {
            this.progressContainer.classList.remove('hidden')
            const percentage = Math.round((current / total) * 100)

            this.progressFill.style.width = percentage + '%'
            this.progressMessage.textContent = message
            this.progressPercentage.textContent = percentage + '%'
            this.progressDetails.textContent = `${current} / ${total}`

            // Update aria attributes
            this.progressContainer.setAttribute('aria-valuenow', percentage)
            this.progressContainer.setAttribute('aria-label', `載入進度: ${percentage}%`)

            // 更新螢幕閱讀器狀態
            const statusElement = document.getElementById('progress-status')
            if (statusElement) {
              statusElement.textContent = `${message} ${percentage}% 完成，${current} 專案，共 ${total} 專案`
            }

            // 播放載入完成的音效提示（可選）
            if (percentage === 100) {
              this.announceCompletion()
            }
          }
        },

        announceCompletion() {
          const statusElement = document.getElementById('progress-status')
          if (statusElement) {
            statusElement.textContent = '載入完成！即將進入應用程式主畫面。'
          }
        },

        hide() {
          if (this.splashElement) {
            // 通知螢幕閱讀器載入完成
            this.splashElement.setAttribute('aria-busy', 'false')
            this.splashElement.setAttribute('aria-hidden', 'true')

            // 移除 dialog 角色和 modal 屬性
            this.splashElement.removeAttribute('role')
            this.splashElement.removeAttribute('aria-modal')

            this.splashElement.classList.add('hidden')

            // 同時移除骨架屏
            const skeleton = document.querySelector('.skeleton-app')
            if (skeleton) {
              skeleton.style.opacity = '0'
              skeleton.style.transition = 'opacity 0.5s ease'
            }

            setTimeout(() => {
              if (this.splashElement && this.splashElement.parentNode) {
                this.splashElement.parentNode.removeChild(this.splashElement)
              }
              if (skeleton && skeleton.parentNode) {
                skeleton.parentNode.removeChild(skeleton)
              }

              // 將焦點移到主內容
              const mainContent = document.getElementById('main-content')
              if (mainContent) {
                mainContent.focus()
              }
            }, 500) // 等待動畫完成
          }
        },
      }

      // 初始化 - 使用 requestAnimationFrame 來最佳化效能
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          requestAnimationFrame(() => window.splashController.init())
        })
      } else {
        requestAnimationFrame(() => window.splashController.init())
      }

      // 預設顯示一些進度，讓使用者知道應用正在載入
      requestAnimationFrame(() => {
        if (window.splashController.progressContainer) {
          window.splashController.updateProgress(1, 10, '正在載入應用...')
        }
      })

      // 模擬早期載入進度
      let earlyProgress = 1
      const earlyInterval = setInterval(() => {
        earlyProgress += 1
        if (earlyProgress <= 6) {
          const messages = [
            '正在載入核心模組...',
            '正在初始化渲染器...',
            '正在載入資源...',
            '正在準備場景...',
            '正在載入材質...',
            '正在設定燈光...',
          ]
          window.splashController.updateProgress(
            earlyProgress,
            10,
            messages[earlyProgress - 1] || '正在載入...',
          )
        } else {
          clearInterval(earlyInterval)
        }
      }, 300)
    </script>
